function setStatus(msg) { document.getElementById("status").textContent = msg; }

function todayStr() {
  return TODAY.toISOString().slice(0,10);
}

function parseDate(str) {
  if (!str) return null;
  const [y,m,d] = str.split("-").map(Number);
  return new Date(y, m-1, d);
}

function calcNext(lastDoneStr, freqBasis, freqVal) {
  const d = parseDate(lastDoneStr);
  if (!d) return null;
  const n = new Date(d);
  if (freqBasis === "Weeks") n.setDate(n.getDate() + freqVal * 7);
  else n.setMonth(n.getMonth() + freqVal);
  return n;
}

function daysDiff(d) {
  return Math.round((d - TODAY) / 86400000);
}

function dueLabel(days) {
  if (days === null) return { text: "—", cls: "due-far" };
  if (days < 0) return { text: `${Math.abs(days)}d overdue`, cls: "due-overdue" };
  if (days === 0) return { text: "Due today", cls: "due-soon" };
  if (days <= 7) return { text: `In ${days}d`, cls: "due-soon" };
  if (days <= 30) return { text: `In ${days}d`, cls: "due-ok" };
  return { text: `In ${days}d`, cls: "due-far" };
}

function freqLabel(basis, val) {
  if (basis === "Weeks") return val === 1 ? "Every week" : `Every ${val} weeks`;
  return val === 1 ? "Every month" : `Every ${val} months`;
}

async function load() {
  // Load chore definitions
  let { data: choreData, error: choreErr } = await sb.from("chores").select("*").order("created_at");
  if (choreErr) { setStatus("Error loading chores."); return; }

  if (choreData.length === 0) {
    setStatus("Setting up chores…");
    const { error: seedErr } = await sb.from("chores").insert(SEED_CHORES);
    if (seedErr) { setStatus("Seed error."); return; }
    const { data: seeded } = await sb.from("chores").select("*").order("created_at");
    chores = seeded || [];
  } else {
    chores = choreData;
  }

  // Seed baseline logs into chore_logs if empty
  const { count } = await sb.from("chore_logs").select("*", { count: "exact", head: true });
  if (count === 0) {
    const baseLogs = [];
    chores.forEach(c => {
      const date = BASELINE[c.name];
      if (date) baseLogs.push({ chore_name: c.name, done_date: date });
    });
    if (baseLogs.length) await sb.from("chore_logs").insert(baseLogs);
  }

  // Load latest done date per chore
  await refreshLogs();
  populateRoomFilter();
  populateAssigneeFilter();
  render();
  setStatus("");
}

async function refreshLogs() {
  const { data } = await sb.from("chore_logs").select("chore_name, done_date").order("done_date", { ascending: false });
  lastDoneMap = {};
  (data || []).forEach(row => {
    if (!lastDoneMap[row.chore_name]) lastDoneMap[row.chore_name] = row.done_date;
  });
}

function populateRoomFilter() {
  const rooms = [...new Set(chores.map(c => c.room).filter(Boolean))].sort();
  const sel = document.getElementById("filter-room");
  sel.innerHTML = '<option value="">All rooms</option>';
  rooms.forEach(r => { const o = document.createElement("option"); o.value = r; o.textContent = r; sel.appendChild(o); });
}

function populateAssigneeFilter() {
  const assignees = [...new Set(chores.map(c => c.assigned_to).filter(Boolean))].sort();
  const sel = document.getElementById("filter-assignee");
  const cur = sel.value;
  sel.innerHTML = '<option value="">All assignees</option>';
  assignees.forEach(a => { const o = document.createElement("option"); o.value = a; o.textContent = a; sel.appendChild(o); });
  if (cur) sel.value = cur;

  // Also update the datalist suggestions
  const dl = document.getElementById("assignee-suggestions");
  const existing = ["Cason", "Ellerie", "PT helper"];
  const extra = assignees.filter(a => !existing.includes(a));
  dl.innerHTML = [...existing, ...extra].map(a => `<option value="${esc(a)}">`).join("");
}

function buildTasks() {
  return chores.map(c => {
    const lastDone = lastDoneMap[c.name] || null;
    const nextDate = calcNext(lastDone, c.freq_basis, c.freq_val);
    const days = nextDate ? daysDiff(nextDate) : null;
    const markedToday = lastDone === todayStr();
    return { ...c, lastDone, nextDate, days, markedToday };
  });
}

function buildRow(t) {
  const due = dueLabel(t.days);
  const isOverdue = (t.days??0) < 0 && !t.markedToday;
  const row = document.createElement("div");
  row.className = "chore-row" + (isOverdue ? " overdue" : "") + (t.markedToday ? " marked-today" : "");
  row.innerHTML = `
    <div>
      <div class="task-name">${esc(t.name)}</div>
      <div class="task-meta">
        <span>${esc(t.room)}</span>
        ${t.assigned_to ? `<span class="assignee-pill">👤 ${esc(t.assigned_to)}</span>` : ""}
      </div>
    </div>
    <div><span class="frequency-pill">${freqLabel(t.freq_basis, t.freq_val)}</span></div>
    <div class="due-label ${due.cls}">${due.text}</div>
    <div class="difficulty">${DIFF_LABEL[t.difficulty]}</div>
    <div>
      <button class="done-btn ${t.markedToday ? "marked" : ""}" data-id="${t.id}">
        ${t.markedToday ? "✓ Done" : "Mark done"}
      </button>
    </div>
    <div><button class="edit-chore" title="Edit">✏️</button></div>
    <div><button class="del-chore" title="Remove">×</button></div>
  `;
  row.querySelector(".done-btn").addEventListener("click", async function() {
    if (this.classList.contains("marked")) return;
    this.textContent = "…"; this.disabled = true;
    await markDone(t.name);
  });
  row.querySelector(".edit-chore").addEventListener("click", () => openModal(t));
  row.querySelector(".del-chore").addEventListener("click", () => deleteChore(t.id, t.name));
  return row;
}

function buildSection(id, labelText, tasks, cls) {
  if (tasks.length === 0) return null;
  const block = document.createElement("div");
  block.className = "section-block";

  const toggle = document.createElement("div");
  toggle.className = `section-toggle ${cls}`;
  const isOpen = sectionOpen[id];
  toggle.innerHTML = `
    <span class="section-chevron ${isOpen ? "open" : ""}">▶</span>
    <span class="section-label">${labelText}</span>
    <span class="section-count">${tasks.length}</span>
  `;

  const rows = document.createElement("div");
  rows.className = "section-rows" + (isOpen ? "" : " collapsed");
  tasks.forEach(t => rows.appendChild(buildRow(t)));

  toggle.addEventListener("click", () => {
    sectionOpen[id] = !sectionOpen[id];
    toggle.querySelector(".section-chevron").classList.toggle("open", sectionOpen[id]);
    rows.classList.toggle("collapsed", !sectionOpen[id]);
  });

  block.appendChild(toggle);
  block.appendChild(rows);
  return block;
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filterRoom = document.getElementById("filter-room").value;
  const filterAssignee = document.getElementById("filter-assignee").value;
  const filterFreq = document.getElementById("filter-freq").value;
  const sortBy = document.getElementById("sort-by").value;

  let tasks = buildTasks().filter(t => {
    if (q && !t.name.toLowerCase().includes(q) && !t.room.toLowerCase().includes(q)) return false;
    if (filterRoom && t.room !== filterRoom) return false;
    if (filterAssignee && t.assigned_to !== filterAssignee) return false;
    if (filterFreq && t.freq_basis !== filterFreq) return false;
    return true;
  });

  const sortFn = sortBy === "room"
    ? (a,b) => a.room.localeCompare(b.room) || (a.days??9999)-(b.days??9999)
    : sortBy === "difficulty"
    ? (a,b) => DIFF_ORDER[b.difficulty]-DIFF_ORDER[a.difficulty] || (a.days??9999)-(b.days??9999)
    : (a,b) => (a.days??9999)-(b.days??9999);

  tasks.sort(sortFn);

  const overdueTasks   = tasks.filter(t => (t.days??0) < 0 && !t.markedToday);
  const soonTasks      = tasks.filter(t => t.days !== null && t.days >= 0 && t.days <= 7);
  const remainingTasks = tasks.filter(t => t.markedToday || t.days === null || t.days > 7);

  document.getElementById("summary-bar").innerHTML = `
    <span class="summary-chip chip-overdue">⚠️ ${overdueTasks.length} overdue</span>
    <span class="summary-chip chip-due-soon">⏰ ${soonTasks.length} due this week</span>
    <span class="summary-chip chip-ok">✅ ${remainingTasks.length} on track</span>
  `;

  const list = document.getElementById("chore-list");
  list.innerHTML = "";

  if (tasks.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.25);padding:48px 0">No tasks match your search.</div>';
    return;
  }

  [
    buildSection("overdue",   "Overdue",        overdueTasks,   "section-overdue"),
    buildSection("soon",      "Due this week",  soonTasks,      "section-soon"),
    buildSection("remaining", "Remaining",      remainingTasks, "section-remaining"),
  ].forEach(el => el && list.appendChild(el));
}

async function markDone(choreName) {
  const { error } = await sb.from("chore_logs").insert({ chore_name: choreName, done_date: todayStr() });
  if (error) { setStatus("Error saving."); return; }
  lastDoneMap[choreName] = todayStr();
  render();
}

async function deleteChore(id, name) {
  if (!confirm(`Remove "${name}"?`)) return;
  setStatus("Removing…");
  const { error } = await sb.from("chores").delete().eq("id", id);
  if (error) { setStatus("Error removing."); return; }
  chores = chores.filter(c => c.id !== id);
  render();
  setStatus("");
}

let editingId = null;

function openModal(chore = null) {
  editingId = chore ? chore.id : null;
  document.getElementById("m-name").value = chore ? chore.name : "";
  document.getElementById("m-room").value = chore ? chore.room : "Whole house";
  document.getElementById("m-freq-val").value = chore ? chore.freq_val : "2";
  document.getElementById("m-freq-basis").value = chore ? chore.freq_basis : "Weeks";
  document.getElementById("m-difficulty").value = chore ? chore.difficulty : "easy";
  document.getElementById("m-assigned").value = chore ? (chore.assigned_to || "") : "";
  document.querySelector(".modal h2").textContent = chore ? "Edit chore" : "Add chore";
  document.getElementById("m-save").textContent = chore ? "Save changes" : "Add chore";
  document.getElementById("modal").classList.add("open");
  document.getElementById("m-name").focus();
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  editingId = null;
}

async function saveChore() {
  const name = document.getElementById("m-name").value.trim();
  const room = document.getElementById("m-room").value;
  const freq_val = parseInt(document.getElementById("m-freq-val").value) || 1;
  const freq_basis = document.getElementById("m-freq-basis").value;
  const difficulty = document.getElementById("m-difficulty").value;
  const assigned_to = document.getElementById("m-assigned").value.trim() || null;
  if (!name) { document.getElementById("m-name").focus(); return; }

  const btn = document.getElementById("m-save");
  btn.disabled = true; btn.textContent = editingId ? "Saving…" : "Adding…";

  if (editingId) {
    const { data, error } = await sb.from("chores").update({ name, room, freq_basis, freq_val, difficulty, assigned_to }).eq("id", editingId).select().single();
    btn.disabled = false; btn.textContent = "Save changes";
    if (error) { alert("Error saving changes."); return; }
    const idx = chores.findIndex(c => c.id === editingId);
    if (idx !== -1) chores[idx] = data;
  } else {
    const { data, error } = await sb.from("chores").insert({ name, room, freq_basis, freq_val, difficulty, assigned_to }).select().single();
    btn.disabled = false; btn.textContent = "Add chore";
    if (error) { alert("Error adding chore."); return; }
    chores.push(data);
  }

  closeModal();
  populateAssigneeFilter();
  render();
}

function esc(str) {
  return (str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

document.getElementById("today-label").textContent =
  TODAY.toLocaleDateString("en-SG", { weekday: "long", year: "numeric", month: "long", day: "numeric" });

document.getElementById("modal").addEventListener("click", e => {
  if (e.target === document.getElementById("modal")) closeModal();
});
document.getElementById("m-name").addEventListener("keydown", e => {
  if (e.key === "Enter") saveChore();
  if (e.key === "Escape") closeModal();
});

["search","filter-room","filter-assignee","filter-freq","sort-by"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});

load();
</script>
</body>
</html>
